<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dice Roller 3D</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <div class="title">Dice Roller</div>
          <div class="subtitle">d6 казино • d20 прототип • очередь игроков</div>
        </div>
      </div>

      <div class="controls">
        <label class="field">
          <span>Кубик</span>
          <select id="sides">
            <option value="6" selected>d6</option>
            <option value="20">d20</option>
          </select>
        </label>

        <label class="field">
          <span>Кол-во</span>
          <input id="count" type="number" min="1" max="100" value="2" />
        </label>

        <label class="field checkbox">
          <span>Авто-ход</span>
          <input id="autoNext" type="checkbox" checked />
        </label>

        <button id="roll" class="btn">🎲 Roll</button>
        <button id="next" class="btn ghost">➡️ Следующий</button>
      </div>
    </header>

    <main class="main">
      <!-- LEFT: PLAYERS -->
      <aside class="panel players-panel">
        <div class="panel-title">Игроки</div>

        <div class="row">
          <input id="nick" class="input" placeholder="Никнейм (Enter добавить)" />
          <input id="pickColor" class="color" type="color" value="#ff3b3b" title="Цвет игрока" />
          <button id="addNick" class="btn">➕</button>
        </div>

        <div class="row small">
          <button id="clearPlayers" class="btn ghost w100">🧹 Очистить игроков</button>
        </div>

        <div id="players" class="players-list"></div>

        <div class="hint">
          🎯 — сделать текущим • 🗑️ — удалить • цвет меняется прямо в карточке
        </div>
      </aside>

      <!-- CENTER: TABLE -->
      <section class="stage">
        <div id="dice3d" class="viewport"></div>

        <div class="hud">
          <div class="hud-card">
            <div class="hud-label">Ход</div>
            <div id="turn" class="hud-value">—</div>
          </div>
          <div class="hud-card result-card">
            <div class="hud-label">Результат</div>
            <div id="result" class="hud-value">—</div>
          </div>
        </div>
      </section>

      <!-- RIGHT: ROLLS -->
      <aside class="panel rolls-panel">
        <div class="panel-title">Броски</div>

        <div class="rolls-toolbar">
          <button id="clearHistory" class="btn ghost">🧹 Очистить</button>
        </div>

        <div id="history" class="history"></div>

        <div class="hint">
          История фиксирована по высоте стола и скроллится.
        </div>
      </aside>
    </main>

    <footer class="footer">
      <span>GitHub Pages • без сборки</span>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
