<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dice Roller 3D</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="dot"></div>
        <div>
          <div class="title">Dice Roller</div>
          <div class="subtitle">d6 казино • d20 чёрный мрамор • очередь игроков</div>
        </div>
      </div>

      <div class="controls">
        <label class="field">
          <span>Кубик</span>
          <select id="sides">
            <option value="6" selected>d6</option>
            <option value="20">d20</option>
          </select>
        </label>

        <label class="field">
          <span>Кол-во</span>
          <input id="count" type="number" min="1" max="10" value="1" />
        </label>

        <label class="field checkbox">
          <span>Авто-ход</span>
          <input id="autoNext" type="checkbox" checked />
        </label>

        <button id="roll" class="btn">🎲 Roll</button>
        <button id="next" class="btn ghost">➡️ Следующий</button>
      </div>
    </header>

    <main class="main">
      <section class="stage">
        <div id="dice3d" class="viewport"></div>

        <div class="hud">
          <div class="hud-card">
            <div class="hud-label">Ход</div>
            <div id="turn" class="hud-value">—</div>
          </div>
          <div class="hud-card">
            <div class="hud-label">Результат</div>
            <div id="result" class="hud-value">—</div>
          </div>
          <div class="hud-card">
            <div class="hud-label">Статус</div>
            <div id="status" class="hud-value small">готов</div>
          </div>
        </div>
      </section>

      <aside class="panel">
        <div class="panel-title">Игроки</div>

        <div class="row">
          <input id="nick" class="input" placeholder="Никнейм (Enter добавить)" />
          <button id="addNick" class="btn">➕</button>
        </div>

        <div id="players" class="players"></div>

        <div class="panel-title" style="margin-top:14px;">История</div>
        <div id="history" class="history"></div>

        <div class="hint">
          Советы: добавь игроков, жми Roll — результат запишется на текущего игрока.
        </div>
      </aside>
    </main>

    <footer class="footer">
      <span>GitHub Pages • без сборки</span>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
